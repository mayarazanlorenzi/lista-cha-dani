<style>
:root{

  --vinho:#743d3b;

}

*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--creme);
  color:var(--vinho);
  font-family:Georgia,"Times New Roman",serif;
}

.page{
  width:min(100%,980px);
  margin:0 auto;
  padding:0 18px 42px;
}

.hero{
  position:relative;
  margin:18px auto 0;
  border:1.5px solid #ef9b87;
  border-radius:24px;
  overflow:hidden;
  background:var(--creme);
  box-shadow:0 10px 35px rgba(210,100,90,.10);
}

.hero-art{
  width:100%;
  display:block;
  height:auto;
  object-fit:contain;
  object-position:center;
}

.list-area{
  position:relative;
  margin-top:0;
  padding:18px 6% 30px;
  background:
    radial-gradient(circle at 7% 10%, rgba(246,115,74,.10) 0 2px, transparent 3px),
    radial-gradient(circle at 93% 18%, rgba(233,77,120,.10) 0 2px, transparent 3px),
    var(--creme);
}

.list-title{
  text-align:center;
  margin:8px 0 24px;
  color:var(--rosa);
  font-family:Georgia,"Times New Roman",serif;
  font-size:32px;
  font-weight:600;
}

.presente{
  width:100%;
  min-height:58px;
  margin:0 0 13px;
  padding:14px 20px;
  border:1px solid #f3b6a9;
  border-radius:18px;
  background:linear-gradient(180deg,#fffaf7,#fff4ef);
  box-shadow:
    0 4px 10px rgba(215,101,85,.10),
    inset 0 0 0 1px rgba(255,255,255,.7);
  color:var(--vinho);
  font:400 17px/1.3 Georgia,"Times New Roman",serif;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  transition:
    transform .16s ease,
    box-shadow .16s ease,
    background .16s ease;
}

.presente:hover{
  transform:translateY(-2px);
  box-shadow:0 7px 16px rgba(215,101,85,.16);
  background:#fff0ea;
}

.presente:active{
  transform:translateY(0);
}

.presente::before{
  content:"✿";
  color:var(--coral);
  margin-right:12px;
  font-size:18px;
}

.presente::after{
  content:"✿";
  color:var(--coral);
  margin-left:12px;
  font-size:18px;
}

.note{
  text-align:center;
  color:#8c5b55;
  font-size:14px;
  line-height:1.4;
  margin:22px auto 0;
}

.decoracao{
  text-align:center;
  color:var(--coral);
  font-size:25px;
  letter-spacing:8px;
  margin:12px 0 20px;
}

.footer{
  text-align:center;
  padding:18px 10px 30px;
  color:var(--vinho);
}

.footer-title{
  color:var(--rosa);
  font-size:25px;
  margin-bottom:8px;
}

.footer-text{
  font-size:17px;
  line-height:1.45;
  max-width:650px;
  margin:0 auto;
}

@media(max-width:600px){

  .page{
    padding:0 9px 24px;
  }

  .hero{
    margin-top:8px;
    border-radius:17px;
  }

  .list-area{
    padding:12px 5% 20px;
  }

  .list-title{
    font-size:28px;
    margin-bottom:20px;
  }

  .presente{
    min-height:54px;
    font-size:15px;
    padding:12px 10px;
    border-radius:15px;
  }

  .presente::before,
  .presente::after{
    font-size:15px;
  }

  .note{
    font-size:12px;
  }

}
</style>
</head>

<script>

const telefone = "5543991089579";

function escolher(botao){

  const item = botao.dataset.item;

  const mensagem =
`Olá! 🧡💐

Escolhi este presente para a Dani:
*${item}*

Estou te avisando para não haver presente repetido. 🧡`;

  const url =
    `https://wa.me/${telefone}?text=${encodeURIComponent(mensagem)}`;

  window.open(url, "_blank");

}
